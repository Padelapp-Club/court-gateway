#cloud-config
# court-gateway на облачной ВМ (Ubuntu/Debian, amd64 или arm64; 1 vCPU, до 1 ГБ памяти).
#
# Вставьте весь файл в поле «Пользовательские данные» (user data / cloud-init) при создании ВМ.
# Белый IP, домен и входящие порты НЕ нужны: шлюз сам подключается к хабу. Если облако
# предлагает открыть порты — не открывайте (SSH можно оставить для себя).
#
# По умолчанию (рекомендуется) файл только ставит программу: пароль и код подключения в нём
# пустые. Через 2–3 минуты после старта ВМ зайдите по SSH и выполните:
#   sudo -u court-gateway /opt/court-gateway/court-gateway setup --config /opt/court-gateway/gateway.yaml &&
#     sudo /opt/court-gateway/court-gateway install-service -config /opt/court-gateway/gateway.yaml --run-as court-gateway
#
# Почему не вписывать пароль сюда: облако хранит этот текст в настройках ВМ, и любая программа
# на ВМ может прочитать его через сервис метаданных облака всё время жизни машины. Скрипт удаляет
# известные ему копии на диске (в /var/lib/cloud/instance и /run/cloud-init), но cloud-init может
# записать их снова, например при перезагрузке, а копию в облаке удалить нельзя.
#
# Итог установки: /root/court-gateway-setup.json и /root/court-gateway-doctor.txt.
write_files:
  - path: /root/court-gateway-setup.env
    permissions: "0600"
    content: |
      # Логин Viva можно вписать; пароль и код лучше ввести по SSH (см. выше).
      CRM_USERNAME=''
      CRM_PASSWORD=''
      GATEWAY_JOIN_CODE=''
      # только для другого хаба, не того, что знает выпуск (оба значения — от оператора):
      GATEWAY_HUB_URL=''
      GATEWAY_HUB_KEY_FINGERPRINT=''

runcmd:
  - - sh
    - -c
    - |
      set -eu
      BASE=https://github.com/Padelapp-Club/court-gateway/releases/latest/download
      DIR=/opt/court-gateway
      SECRETS=/root/court-gateway-setup.env
      # the secrets and cloud-init's on-disk copies of the user data go on
      # every exit, a failed one included
      forget() {
        shred -u "$SECRETS" 2>/dev/null || rm -f "$SECRETS"
        for f in user-data.txt user-data.txt.i cloud-config.txt obj.pkl; do
          rm -f "/var/lib/cloud/instance/$f"
        done
        rm -f /run/cloud-init/combined-cloud-config.json /run/cloud-init/instance-data-sensitive.json
      }
      trap forget EXIT
      ARCH="$(dpkg --print-architecture 2>/dev/null || uname -m)"
      case "$ARCH" in
        amd64|x86_64) ARCH=amd64 ;;
        arm64|aarch64) ARCH=arm64 ;;
        *) echo "court-gateway: архитектура $ARCH не поддерживается" >&2; exit 1 ;;
      esac
      id court-gateway >/dev/null 2>&1 || useradd --system --home-dir "$DIR" --shell /usr/sbin/nologin court-gateway
      mkdir -p "$DIR"
      cd "$DIR"
      # download; nothing runs unless SHA256SUMS is signed by the release
      # key written here and the checksum matches (set -e)
      curl -fsSL --retry 5 -o SHA256SUMS "$BASE/SHA256SUMS"
      curl -fsSL --retry 5 -o SHA256SUMS.sig "$BASE/SHA256SUMS.sig"
      echo 'court-gateway ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJAe4CDRNNnk++UtmLOdDcQcRc0jK56eYJPo+DfdyK8y' > allowed_signers
      ssh-keygen -Y verify -f allowed_signers -I court-gateway -n court-gateway -s SHA256SUMS.sig < SHA256SUMS
      FILE="$(awk '/-linux-'"$ARCH"'$/ {print $2}' SHA256SUMS)"
      curl -fsSL --retry 5 -o "$FILE" "$BASE/$FILE"
      grep " $FILE\$" SHA256SUMS | sha256sum -c -
      install -m 0755 "$FILE" court-gateway
      rm -f "$FILE"
      chown -R court-gateway:court-gateway "$DIR"
      set -a; . "$SECRETS"; set +a
      forget
      if [ -z "${CRM_PASSWORD:-}" ] || [ -z "${GATEWAY_JOIN_CODE:-}" ]; then
        echo '{"ok": false, "error": {"code": "SETUP_OVER_SSH", "message": "программа установлена; выполните setup по SSH (см. начало cloud-init)"}}' > /root/court-gateway-setup.json
        exit 0
      fi
      rc=0
      runuser -u court-gateway -- ./court-gateway setup --non-interactive --json --config "$DIR/gateway.yaml" > /root/court-gateway-setup.json || rc=$?
      if [ "$rc" -ne 0 ]; then
        # no service without a working config: the reason is in the JSON
        echo "court-gateway: setup не удался (код $rc), служба не установлена — см. /root/court-gateway-setup.json" >&2
        exit 1
      fi
      ./court-gateway install-service -config "$DIR/gateway.yaml" --run-as court-gateway
      sleep 30
      ./court-gateway doctor -config "$DIR/gateway.yaml" > /root/court-gateway-doctor.txt 2>&1 || true
