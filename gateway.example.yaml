# Пример конфигурации. Скопируйте в gateway.yaml и поправьте под свой клуб.
# Пароль CRM и ключи партнёров сюда НЕ пишутся — только в переменные окружения (.env).

club:
  id: my-club            # короткое имя латиницей, войдёт в адреса API
  name: "Мой клуб"

listen: ":8080"          # адрес и порт сервиса

crm:
  type: viva             # тип CRM клуба
  username: admin@example.com   # логин администратора в CRM; пароль — в CRM_PASSWORD
  studio: 00000000-0000-0000-0000-000000000000   # идентификатор студии в CRM

venue:
  timezone: Europe/Moscow
  slot_minutes: 30       # шаг сетки бронирования, минут
  hours:                 # часы работы; выходной день — closed
    mon-fri: "07:00-23:00"
    sat-sun: "08:00-23:00"

courts:
  - id: court-1
    name: "Корт 1"
    viva_room: 00000000-0000-0000-0000-000000000001     # комната корта в CRM
    price_list: 00000000-0000-0000-0000-000000000002    # прайс-лист корта (необязательно)

# Услуга, которой создаётся бронь. Если не указана — создаётся техническая блокировка.
services:
  booking: { direction: 1, type: 1 }
  # tournament: { direction: 1, type: 2 }

partners:
  - name: aggregator
    key_env: PARTNER_KEY_1   # имя переменной окружения с ключом партнёра
    scopes: [read, book]     # read — только сверка; book — ещё и бронирование
