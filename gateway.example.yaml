# Пример конфигурации шлюза. Обычно этот файл записывает команда `court-gateway setup`;
# пример нужен, чтобы понимать, что в нём лежит, и для ручной настройки.
# Пароль CRM и секрет подключения к хабу сюда НЕ пишутся — только в .env рядом.
#
# Одна установка шлюза — одна учётная запись CRM, в которой может быть несколько клубов.
# Клубы, корты и часы работы здесь НЕ задаются: их настраивает оператор на хабе, и шлюз
# получает их сам (при подключении и при каждом изменении). Клубу ничего делать не нужно.

# Связь только исходящая: шлюз сам подключается к хабу по HTTPS (порт 443).
# Белый IP, домен, сертификат и проброс портов не нужны.
hub:
  url: https://hub.example.test
  # secret_env: GATEWAY_HUB_SECRET   # переменная с секретом подключения (по умолчанию эта)
  # polls: 4                         # сколько запросов партнёров шлюз обслуживает одновременно

# listen: "127.0.0.1:8080"   # локальный порт — только для отладки в своей сети; по умолчанию закрыт

crm:
  type: viva                      # тип CRM
  username: admin@example.test    # логин администратора CRM; пароль — в CRM_PASSWORD

# update:
#   enabled: true        # автообновление из подписанных выпусков (по умолчанию включено)

# ---- Только без хаба (локальный режим) ----
# Без раздела hub клуб задаётся здесь, а партнёры ходят на listen по ключам из partners.
# С хабом этих разделов быть не должно: клубы задаёт оператор на хабе.
#
# club:
#   id: my-club
#   name: "Мой клуб"
# crm:  (к разделу выше добавляются ключи клуба)
#   studio: 00000000-0000-0000-0000-000000000000
#   overnight_minutes: 240     # насколько бронь может заходить за полночь (README, «Занятость в Viva»)
#   break_lookback_days: 7     # на сколько дней назад искать многодневные перерывы
# venue:
#   timezone: Europe/Moscow
#   slot_minutes: 30       # шаг сетки бронирования, минут
#   hours:                 # часы работы; выходной день — closed
#     mon-fri: "07:00-23:00"
#     sat-sun: "08:00-23:00"
# courts:
#   - id: court-1
#     name: "Корт 1"
#     viva_room: 00000000-0000-0000-0000-000000000001     # комната корта в CRM
#     price_list: 00000000-0000-0000-0000-000000000002    # прайс-лист корта (необязательно)
# services:                # услуга, которой создаётся бронь; без неё — техническая блокировка
#   booking: { direction: 1, type: 1 }
# partners:
#   - name: aggregator
#     key_env: PARTNER_KEY_1
#     scopes: [read, book]
