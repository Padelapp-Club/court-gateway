# Gateway of one installation. Prepare gateway.yaml and .env first (README, «Docker»):
#   docker run --rm -it --user "$(id -u):$(id -g)" -v "$PWD:/config" <image> setup --config /config/gateway.yaml
# then: docker compose up -d
#
# <image> is court-gateway:local, built from this repository: a self-build,
# which never updates itself. Once a release image is published, its digest
# is in the signed SHA256SUMS: pin <registry>/court-gateway@sha256:<digest>.
#
# No ports are published: the gateway connects out to the hub.
services:
  court-gateway:
    image: court-gateway:local   # or <registry>/court-gateway@sha256:<digest>
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./gateway.yaml:/config/gateway.yaml:ro
      # the state directory (/home/nonroot/state): the count of rejected
      # CRM logins and the verified updates outlive a recreated container
      - state:/home/nonroot
    healthcheck:   # the same check as the image's
      test: ["CMD", "/court-gateway", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  state:
